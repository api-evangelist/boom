aid: boom
name: Boom
description: >-
  Boom Supersonic is a Colorado-based aerospace company building Overture, a
  Mach 1.7 supersonic airliner designed to carry 64-80 passengers on
  transoceanic routes, powered by the company's Symphony engine and assembled
  at its Superfactory in Greensboro, North Carolina. Its XB-1 demonstrator flew
  supersonic in early 2025. Boom was surfaced as a portfolio company of SV Angel
  and added to the API Evangelist network. Boom publishes a corporate and
  investor-facing web presence (newsroom, careers, privacy, terms) but exposes
  no public developer API, OpenAPI, well-known discovery, or MCP surface, so no
  API artifacts are available to enrich; this profile captures its verifiable
  web and domain-security posture only.
